name: "🧪 Physics Gate (CI)"

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  physics-gate:
    name: "🧪 Sovereign Audit & Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: "Install Dependencies"
        run: npm ci --legacy-peer-deps
      - name: "Sovereign Verification (Lint, Audit, Test)"
        run: npm run verify
      - name: "Verify Production Bundle Build"
        run: npm run build
      - name: "Verify Git Cleanliness (Zero Artifact Drift)"
        run: git diff --exit-code
