<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // CRITICAL: Required for Perchance cross-origin iframe communication
      try {
        document.domain = "perchance.org";
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RPGlitch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Satisfy&family=Ubuntu:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Plugins exported from Left Panel directly -->
    <script data-no-vault>
      // Copy canonical Perchance plugin functions onto window for ES-module
      // code, which cannot see pjs scope bindings directly. `root` is a real
      // global carrying every {import:...} binding; indirect eval can NOT
      // reach pjs scope (it evaluates in global scope only), so read root.
      (function () {
        const PLUGIN_NAMES = ["generate_text", "generate_image", "fetch_web"];
        const MAX_POLLS = 100;
        let polls = 0;

        function capture_plugins() {
          let all_found = true;

          for (const name of PLUGIN_NAMES) {
            if (typeof window[name] !== "undefined") continue;
            try {
              const holder = typeof globalThis.root !== "undefined" ? globalThis.root : undefined;
              const candidate = holder ? holder[name] : undefined;
              if (typeof candidate === "function") {
                window[name] = candidate.bind ? candidate.bind(holder) : candidate;
              } else {
                all_found = false;
              }
            } catch {
              all_found = false;
            }
          }

          if (!all_found && polls < MAX_POLLS) {
            polls++;
            setTimeout(capture_plugins, 50);
          }
        }
        capture_plugins();
      })();
    </script>

    <script type="module" src="/main.js"></script>
  </body>
</html>
